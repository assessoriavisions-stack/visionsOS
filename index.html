<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f1f2f5;
  --border:#eceef1; --border-strong:#dee2e6;
  --text:#272727; --text-2:#5a5a5a; --text-3:#8b9099;
  --primary:#3552c7; --primary-2:#4c6fe0; --primary-soft:#edf1fd; --primary-ink:#ffffff;
  --brand:#2050a0; --brand-2:#4c6fe0; --brand-soft:#edf1fd; --gold:#c7860a;
  --side:#ffffff; --side-2:#f4f5f7; --side-text:#5a5a5a; --side-active:#3552c7;
  --good:#12855a; --good-soft:#e7f6ef;
  --warn:#a36d06; --warn-soft:#fdf4e1;
  --bad:#d82828; --bad-soft:#fdecec;
  --info:#2050a0; --info-soft:#edf1fd;
  --s1:#4c6fe0; --s2:#c7860a; --s3:#17a567; --s4:#ff6700; --s5:#ee7fac; --s6:#2050a0; --s7:#6a4ce2; --s8:#ec4647;
  --shadow:0 1px 2px rgba(39,39,39,.04),0 1px 3px rgba(39,39,39,.05);
  --shadow-lg:0 12px 40px rgba(39,39,39,.16);
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#101114; --surface:#181a1f; --surface-2:#1d2026; --surface-3:#262a31;
    --border:#2b2f37; --border-strong:#3a3f49;
    --text:#eeeff2; --text-2:#a9adb6; --text-3:#7a7f89;
    --primary:#8ea6f5; --primary-2:#6d8bf0; --primary-soft:#1c2440; --primary-ink:#101114;
    --brand:#7b97f0; --brand-2:#6d8bf0; --brand-soft:#1c2440; --gold:#e0a12a;
    --side:#14161a; --side-2:#1f2228; --side-text:#a9adb6; --side-active:#8ea6f5;
    --good:#3ccf86; --good-soft:#123326; --warn:#f2b44b; --warn-soft:#3a2b10; --bad:#ff7a78; --bad-soft:#3d1a1d; --info:#7b97f0; --info-soft:#1c2440;
    --s1:#6d8bf0; --s2:#d99a1e; --s3:#1fbf78; --s4:#ff7a1f; --s5:#e24d8b; --s6:#7b97f0; --s7:#9887ef; --s8:#eb6263;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101114; --surface:#181a1f; --surface-2:#1d2026; --surface-3:#262a31;
  --border:#2b2f37; --border-strong:#3a3f49;
  --text:#eeeff2; --text-2:#a9adb6; --text-3:#7a7f89;
  --primary:#8ea6f5; --primary-2:#6d8bf0; --primary-soft:#1c2440; --primary-ink:#101114;
  --brand:#7b97f0; --brand-2:#6d8bf0; --brand-soft:#1c2440; --gold:#e0a12a;
  --side:#14161a; --side-2:#1f2228; --side-text:#a9adb6; --side-active:#8ea6f5;
  --good:#3ccf86; --good-soft:#123326; --warn:#f2b44b; --warn-soft:#3a2b10; --bad:#ff7a78; --bad-soft:#3d1a1d; --info:#7b97f0; --info-soft:#1c2440;
  --s1:#6d8bf0; --s2:#d99a1e; --s3:#1fbf78; --s4:#ff7a1f; --s5:#e24d8b; --s6:#7b97f0; --s7:#9887ef; --s8:#eb6263;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.boot{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-2)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.display{font-family:Montserrat,Inter,sans-serif;font-weight:800;letter-spacing:-.02em}

/* layout */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--border)}
.side .brand{border-radius:12px;padding:6px 8px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
:root[data-theme="dark"] .side .brand{background:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side .brand{background:#fff}}
.side .brand img{height:40px;display:block}
.side .tagline{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);text-align:center;margin:6px 0 10px}
.side .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin:16px 10px 6px;font-weight:600}
.side .it{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;border:0;background:none;color:var(--side-text);cursor:pointer;text-align:left;font-weight:500}
.side .it:hover{background:var(--side-2);color:var(--text)}
.side .it.on{background:var(--primary-soft);color:var(--side-active);font-weight:600}
.side .it svg{flex:none;opacity:.9}
.side .it .bd{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--text-2);border-radius:20px;padding:1px 8px}
.side .it .bd.hot{background:var(--bad);color:#fff}
.side .foot{margin-top:auto;padding-top:14px;font-size:12px;color:var(--text-3);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 28px}
.top .ttl{font-weight:700;font-size:15px}
.top .sp{flex:1}
.search-btn{display:flex;align-items:center;gap:8px;min-width:240px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 12px;color:var(--text-3);cursor:pointer}
.search-btn kbd{margin-left:auto}
kbd{font:11px Inter,sans-serif;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--text-3);background:var(--surface-2)}
.content{padding:24px 28px 80px;max-width:1360px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:24px}
.page-h p{margin:4px 0 0;color:var(--text-2)}
.mobile-nav{display:none}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card.tight{padding:12px 14px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{font-size:14px}
.card-h .sub{color:var(--text-3);font-size:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--text-2)}
.faint{color:var(--text-3)}
.small{font-size:12px}
.xs{font-size:11px}
.b{font-weight:700}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.right{text-align:right}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:var(--border);margin:14px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.btn.pri:hover{background:var(--primary)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.wa:hover{background:#178a45}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12px;font-weight:600;color:var(--text-2)}
.fld .hint{font-size:11.5px;color:var(--text-3)}
.inp{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 11px;outline:none;transition:border-color .12s,box-shadow .12s;min-width:0}
.inp:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-2) 18%,transparent)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.45}
.inp.sm{padding:6px 9px;font-size:13px}
.inp-pre{position:relative}
.inp-pre span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px;pointer-events:none}
.inp-pre .inp{padding-left:34px}
.form{display:grid;gap:12px}
.form.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.form.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--surface);padding:5px 11px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-2)}
.chip.on{background:var(--primary-soft);border-color:var(--primary-2);color:var(--primary)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.info{background:var(--info-soft);color:var(--info)}
.tag.pri{background:var(--primary-soft);color:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--text-3);margin-top:2px}
.kpi.accent{background:linear-gradient(135deg,#1a3f80,#2050a0 55%,#4c6fe0);border:0;color:#fff}
.kpi.accent .l,.kpi.accent .s{color:#d3ddfa}
.delta-up{color:var(--good);font-weight:700}.delta-down{color:var(--bad);font-weight:700}

/* progress */
.bar{height:8px;background:var(--surface-3);border-radius:10px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:10px;background:var(--s1);transition:width .3s}
.bar.good>i{background:var(--good)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.bar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55;border-radius:2px}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.lrow .main-t{font-weight:600}
.lgroup{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--text-3);padding:12px 14px 6px;background:var(--surface-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.lgroup.bad{color:var(--bad)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:var(--surface-3);border-radius:var(--r);padding:8px;min-height:120px;transition:background .12s}
.kcol.drop{background:var(--primary-soft);outline:2px dashed var(--primary-2)}
.kcol-h{display:flex;align-items:center;gap:7px;padding:6px 6px 10px;font-weight:700;font-size:13px}
.kcol-h .sum{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:600}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .12s}
.kcard:hover{box-shadow:0 4px 14px rgba(20,22,43,.1)}
.kcard.dragging{opacity:.4}
.kcard .nm{font-weight:700;font-size:13.5px}
.kcard .co{font-size:12px;color:var(--text-2)}
.kcard .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.kcard .na{margin-top:8px;font-size:11.5px;display:flex;align-items:center;gap:5px}

/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(14,15,30,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;animation:fade .12s}
.mdl{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .15s}
.mdl.lg{max-width:760px}
.mdl-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mdl-h h3{font-size:16px}
.mdl-b{padding:18px 20px}
.mdl-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 16px 16px}
.drawer-ov{position:fixed;inset:0;background:rgba(14,15,30,.35);z-index:90;animation:fade .12s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--surface);z-index:91;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .18s}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--border)}
.drawer-b{padding:16px 20px;overflow-y:auto;flex:1}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}

/* stepper */
.stepper{display:flex;gap:3px;flex-wrap:wrap}
.stepper button{flex:1;min-width:70px;border:0;padding:7px 4px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--text-2);cursor:pointer}
.stepper button:first-child{border-radius:8px 0 0 8px}.stepper button:last-child{border-radius:0 8px 8px 0}
.stepper button.done{background:var(--primary-soft);color:var(--primary)}
.stepper button.cur{background:var(--primary-2);color:#fff}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-i{position:relative;margin-bottom:14px}
.tl-i:before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--primary-2)}
.tl-i .w{font-size:11.5px;color:var(--text-3)}

/* counters (prospecção) */
.counter{display:flex;align-items:center;gap:6px}
.counter .cv{min-width:42px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.counter button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:800;font-size:16px}
.counter button.plus{background:var(--primary-2);border-color:var(--primary-2);color:#fff}
.counter button:active{transform:scale(.95)}

/* funnel */
.fun-row{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;margin-bottom:8px}
.fun-row .lb{color:var(--text-2);font-size:13px}
.fun-bar{height:30px;background:var(--surface-3);border-radius:8px;position:relative;overflow:hidden}
.fun-bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:8px;min-width:4px}
.fun-bar>span{position:relative;z-index:1;display:flex;align-items:center;height:100%;padding:0 10px;font-size:12.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
.fun-bar.first>span{color:#fff}

/* calc */
.calc-out .big{font-family:Montserrat,Inter,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.callout{border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55}
.callout.good{background:var(--good-soft)}.callout.warn{background:var(--warn-soft)}.callout.bad{background:var(--bad-soft)}.callout.info{background:var(--info-soft)}
.callout b.t{display:block;margin-bottom:2px}
.callout.good b.t{color:var(--good)}.callout.warn b.t{color:var(--warn)}.callout.bad b.t{color:var(--bad)}.callout.info b.t{color:var(--info)}

/* charts */
.chart{width:100%;max-height:280px;display:block;overflow:visible}
.chart text{fill:var(--text-3);font-size:11px;font-family:Inter,sans-serif}
.chart .grid-l{stroke:var(--border);stroke-width:1}
.chart .axis-0{stroke:var(--border-strong);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--text);color:var(--surface);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow-lg);white-space:nowrap}
.tip b{font-weight:700}

/* toast & fab & palette */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#272727;color:#fff;border-radius:12px;padding:10px 16px;box-shadow:var(--shadow-lg);display:flex;gap:12px;align-items:center;font-size:13.5px;animation:pop .15s}
.toast button{background:none;border:0;color:#a9bcf7;font-weight:700;cursor:pointer;text-decoration:underline}
.fab{position:fixed;right:24px;bottom:24px;z-index:60;width:54px;height:54px;border-radius:50%;border:0;background:var(--primary-2);color:#fff;box-shadow:0 8px 24px rgba(76,111,224,.4);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab-menu{position:fixed;right:24px;bottom:88px;z-index:61;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;min-width:250px;animation:pop .12s}
.fab-menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-weight:600}
.fab-menu button:hover{background:var(--surface-3)}
.fab-menu .k{margin-left:auto}
.pal{max-width:600px}
.pal input{border:0;border-bottom:1px solid var(--border);border-radius:16px 16px 0 0;padding:16px 18px;font-size:16px;width:100%;outline:none;background:transparent}
.pal .res{max-height:50vh;overflow-y:auto;padding:6px}
.pal .res button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer;text-align:left}
.pal .res button.sel,.pal .res button:hover{background:var(--primary-soft)}
.empty{text-align:center;color:var(--text-3);padding:28px 12px}
.empty b{display:block;color:var(--text-2);margin-bottom:4px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3)}
.month-nav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:3px}
.month-nav b{min-width:130px;text-align:center;text-transform:capitalize;font-size:13.5px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat div{height:30px;border-radius:5px;background:var(--surface-3);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.script{background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:9px;padding:10px 12px;white-space:pre-wrap;font-size:13px;line-height:1.5}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 600px at 0% 0%,#4c6fe0 0%,transparent 55%),radial-gradient(900px 500px at 100% 100%,#17a567 0%,transparent 50%),#1a3f80;padding:20px}
.login .card{width:100%;max-width:400px;padding:28px}

@media (max-width:1100px){
  .g5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side{grid-template-columns:1fr}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:10px 16px}
  .search-btn{min-width:0;flex:1}
  .search-btn kbd,.search-btn .t{display:none}
  .content{padding:16px 16px 110px}
  .g2,.g3,.g-side{grid-template-columns:1fr}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form.c2,.form.c3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--surface);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .mobile-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--text-3);font-weight:600;cursor:pointer;padding:4px}
  .mobile-nav button.on{color:var(--primary)}
  .fab{bottom:78px;right:16px}
  .fab-menu{bottom:142px;right:16px}
  .fun-row{grid-template-columns:110px 1fr}
  .kpi .v{font-size:20px}
  .page-h h1{font-size:20px}
}
@media print{.side,.top,.fab,.mobile-nav,.no-print,.page-h .row,.toasts{display:none!important}.shell{display:block}body{background:#fff}.content{padding:0;max-width:none}.card,.kpi{box-shadow:none;break-inside:avoid}}
@media (max-width:860px){.hide-sm{display:none}}

</style>
</head>

/* ============================================================

const { useState, useEffect, useMemo, useRef, useCallback, useContext, createContext, Fragment } = React;
const html = htm.bind(React.createElement);

/* ---------- formatação ---------- */
const BRL0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const BRL2 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (v, dec) => { const n = Number(v) || 0; return (dec || (Math.abs(n) < 100 && n % 1 !== 0) ? BRL2 : BRL0).format(n); };
const money2 = v => BRL2.format(Number(v) || 0);
const num = (v, d = 0) => (Number.isFinite(+v) ? (+v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : '—');
const pct = (v, d = 0) => (Number.isFinite(v) ? num(v, d) + '%' : '—');
const ratio = (a, b) => (b > 0 ? a / b : NaN);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const n0 = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(x) ? x : 0; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? (Number(f(x)) || 0) : (Number(x) || 0)), 0);
const groupBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); (m[k] = m[k] || []).push(x); return m; }, {});
const vals = o => (o ? Object.values(o) : []).filter(Boolean);
const initials = s => (s || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
const fill = (tpl, map) => (tpl || '').replace(/\{(\w+)\}/g, (m, k) => (map[k] != null && map[k] !== '' ? map[k] : m));
const onlyDigits = s => String(s || '').replace(/\D/g, '');
const waLink = (phone, text) => {
  let d = onlyDigits(phone);
  if (d && d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');

const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5); // b - a
const ymOf = s => String(s || '').slice(0, 7);
const ymNow = () => ymOf(today());
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1, 12); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dueIn = (ym, day) => ym + '-' + pad(clamp(Number(day) || 1, 1, daysInMonth(ym)));
const addMonthsDate = (s, n, dayPref) => dueIn(addMonths(ymOf(s), n), dayPref || parseD(s).getDate());
const isWeekend = s => { const w = parseD(s).getDay(); return w === 0 || w === 6; };
const nextBiz = s => { let x = s; while (isWeekend(x)) x = addDays(x, 1); return x; };
const bizDays = ym => { let c = 0; for (let i = 1; i <= daysInMonth(ym); i++) if (!isWeekend(dueIn(ym, i))) c++; return c; };
const bizElapsed = (ym, ref) => { // dias úteis já transcorridos no mês (inclui hoje)
  const t = ref || today(); if (ymOf(t) > ym) return bizDays(ym); if (ymOf(t) < ym) return 0;
  let c = 0; const lim = parseD(t).getDate(); for (let i = 1; i <= lim; i++) if (!isWeekend(dueIn(ym, i))) c++; return c;
};

/* ---------- storage: Firebase RTDB (REST) + cache local + fila offline ---------- */
const FB_BASE = 'https://visions-os2-default-rtdb.firebaseio.com/vos';
const NS = 'vos7_';
const COLLS = ['clients', 'contracts', 'payments', 'costs', 'deals', 'cadences', 'prospect', 'spend', 'goals', 'perf', 'asaas'];
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sem storage */ } }
};
const urlLocal = /[?&]local=1/.test(location.search);
const MODE = urlLocal ? 'local' : 'remote';
const CACHE_KEY = MODE === 'local' ? 'vos7_localdb' : 'vos7_cache';
const QUEUE_KEY = 'vos7_queue';

const cleanKey = k => String(k).replace(/[.$#\[\]\/]/g, '_');
const fbUrl = path => FB_BASE + '/' + path + '.json';
async function fbGet(path) {
  const r = await fetch(fbUrl(path), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const v = await r.json();
  if (v && typeof v === 'object' && typeof v.error === 'string' && Object.keys(v).length === 1) throw new Error(v.error);
  return v;
}
async function fbPut(path, body) {
  const r = await fetch(fbUrl(path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
async function fbDel(path) {
  const r = await fetch(fbUrl(path), { method: 'DELETE' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

function createStore() {
  const empty = () => { const d = { settings: null }; COLLS.forEach(c => (d[c] = {})); return d; };
  let data = Object.assign(empty(), LS.get(CACHE_KEY, {}));
  COLLS.forEach(c => { if (!data[c] || typeof data[c] !== 'object') data[c] = {}; });
  let queue = MODE === 'remote' ? LS.get(QUEUE_KEY, []) : [];
  let status = MODE === 'local' ? 'local' : 'loading';
  let lastSync = null;
  const subs = new Set();
  let ver = 0;
  const emit = () => { ver++; subs.forEach(f => f(ver)); };
  let saveT = null;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => LS.set(CACHE_KEY, data), 150); };
  const applyOp = (op) => {
    if (op.coll === 'settings') { data = Object.assign({}, data, { settings: op.body }); return; }
    const m = Object.assign({}, data[op.coll]);
    if (op.op === 'del') delete m[op.id]; else m[op.id] = op.body;
    data = Object.assign({}, data, { [op.coll]: m });
  };
  queue.forEach(applyOp); // alterações ainda não enviadas continuam visíveis após recarregar
  window.addEventListener('beforeunload', () => { clearTimeout(saveT); LS.set(CACHE_KEY, data); });
  const pathOf = op => NS + op.coll + (op.coll === 'settings' ? '' : '/' + cleanKey(op.id));
  async function flush() {
    if (MODE !== 'remote' || !queue.length) return;
    while (queue.length) {
      const op = queue[0];
      try {
        if (op.op === 'del') await fbDel(pathOf(op)); else await fbPut(pathOf(op), op.body);
        queue.shift(); LS.set(QUEUE_KEY, queue);
      } catch (e) { status = 'offline'; emit(); return; }
    }
    status = 'online'; lastSync = new Date(); emit();
  }
  function write(op) {
    applyOp(op); persist(); emit();
    if (MODE === 'remote') { queue.push(op); LS.set(QUEUE_KEY, queue); flush(); }
  }
  async function load() {
    if (MODE === 'local') { status = 'local'; emit(); return true; }
    try {
      const res = await Promise.all(COLLS.map(c => fbGet(NS + c)).concat([fbGet(NS + 'settings')]));
      const nd = empty();
      COLLS.forEach((c, i) => { const v = res[i]; nd[c] = v && typeof v === 'object' && !Array.isArray(v) ? v : {}; });
      nd.settings = res[COLLS.length] || null;
      data = nd;
      queue.forEach(applyOp); // mudanças locais ainda não enviadas por cima do remoto
      persist(); status = queue.length ? 'syncing' : 'online'; lastSync = new Date(); emit();
      flush();
      return true;
    } catch (e) {
      console.warn('Visions OS: sem conexão com o banco, usando cópia local.', e);
      status = 'offline'; emit(); return false;
    }
  }
  return {
    get data() { return data; },
    get status() { return status; },
    get pending() { return queue.length; },
    get lastSync() { return lastSync; },
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    load, flush,
    put(coll, obj) {
      const body = Object.assign({}, obj, { updatedAt: stamp() });
      if (!body.id) body.id = uid();
      if (!body.createdAt) body.createdAt = body.updatedAt;
      write({ op: 'put', coll, id: body.id, body });
      return body;
    },
    putMany(coll, list) { list.forEach(o => this.put(coll, o)); },
    del(coll, id) { const prev = data[coll] && data[coll][id]; write({ op: 'del', coll, id }); return prev; },
    restore(coll, obj) { write({ op: 'put', coll, id: obj.id, body: obj }); },
    setSettings(patch) {
      const body = Object.assign({}, settingsOf(data), patch, { updatedAt: stamp() });
      write({ op: 'put', coll: 'settings', id: 'settings', body });
    },
    replaceAll(nd) { // usado no restore de backup
      data = Object.assign(empty(), nd); persist(); emit();
      if (MODE === 'remote') {
        COLLS.forEach(c => vals(data[c]).forEach(o => queue.push({ op: 'put', coll: c, id: o.id, body: o })));
        if (data.settings) queue.push({ op: 'put', coll: 'settings', id: 'settings', body: data.settings });
        LS.set(QUEUE_KEY, queue); flush();
      }
    }
  };
}
const settingsOf = d => {
  const s = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  ['products', 'channels', 'team', 'costCategories', 'lossReasons'].forEach(k => { if (!Array.isArray(s[k]) || !s[k].length) s[k] = DEFAULT_SETTINGS[k]; });
  s.dailyGoals = s.dailyGoals || {}; s.calcProsp = s.calcProsp || {};
  s.fx = Object.assign({}, DEFAULT_SETTINGS.fx, s.fx || {}); s.asaas = Object.assign({}, DEFAULT_SETTINGS.asaas, s.asaas || {}); s.perfBench = Object.assign({}, DEFAULT_SETTINGS.perfBench, s.perfBench || {});
  return s;
};

const store = createStore();
const StoreCtx = createContext(null);
function useStore() {
  const [, setV] = useState(0);
  useEffect(() => store.subscribe(v => setV(v)), []);
  return store;
}
function useDB() { // dados + settings normalizados
  const s = useStore();
  const d = s.data;
  return useMemo(() => ({ ...d, S: settingsOf(d), store: s }), [d, s.status]);
}

const toastBus = { list: [], subs: new Set() };
function toast(msg, action, ms = 5000) {
  const t = { id: uid(), msg, action };
  toastBus.list = toastBus.list.concat(t).slice(-3); toastBus.subs.forEach(f => f(toastBus.list));
  setTimeout(() => { toastBus.list = toastBus.list.filter(x => x.id !== t.id); toastBus.subs.forEach(f => f(toastBus.list)); }, ms);
}
function delWithUndo(coll, id, label) {
  const prev = store.del(coll, id);
  if (prev) toast((label || 'Item') + ' excluído.', { l: 'Desfazer', f: () => store.restore(coll, prev) }, 8000);
}

// status derivado pelas datas: ativo / aviso (tem data de término futura) / encerrado
function contractStatus(c, ref) {
  const t = ref || today();
  if (c.kind === 'projeto') {
    if (c.canceled) return 'encerrado';
    return 'projeto';
  }
  if (c.kind === 'espelho') return c.endDate ? (c.endDate < t ? 'encerrado' : 'aviso') : 'ativo';

// Calculadora de metas & CAC (funil reverso estilo Visions Tracking)
function calcGoal(p) {
  const ticket = n0(p.ticket), setup = n0(p.setup), meta = n0(p.meta);
  const r1 = n0(p.rLeadMeet) / 100, r2 = n0(p.rShow) / 100, r3 = n0(p.rClose) / 100;
  const cpl = n0(p.cpl), ret = n0(p.ret) || 1, margin = n0(p.margin) / 100, days = n0(p.days) || 22, fixed = n0(p.fixed);
  const sales = p.mode === 'vendas' ? n0(p.sales) : (ticket > 0 ? Math.ceil(meta / ticket) : 0);
  const meetings = r3 > 0 ? Math.ceil(sales / r3) : 0;
  const scheduled = r2 > 0 ? Math.ceil(meetings / r2) : 0;
  const leads = r1 > 0 ? Math.ceil(scheduled / r1) : 0;
  const invest = leads * cpl;
  const cac = sales > 0 ? (invest + fixed) / sales : NaN;
  const ltv = ticket * ret * margin + setup;
  const cacMax = ltv / 3;
  const payback = ticket * margin > 0 ? cac / (ticket * margin) : NaN;
  return {
    sales, meetings, scheduled, leads, invest, cac, ltv, cacMax, ltvCac: ltv / cac, payback,
    leadsDay: leads / days, newMrr: sales * ticket, setupTotal: sales * setup, cpm: meetings ? (invest + fixed) / meetings : NaN,
    roi12: sales > 0 ? ((ticket * margin * Math.min(12, ret) + setup) * sales - invest - fixed) / (invest + fixed || 1) : NaN
  };
}
// Calculadora de prospecção (abordagens -> respostas -> conversas -> reuniões -> comparecem -> vendas)
function calcProsp(p) {
  const perDay = n0(p.perDay), days = n0(p.days) || 22, ticket = n0(p.ticket), meta = n0(p.meta);
  const r = [n0(p.rResp), n0(p.rConv), n0(p.rMeet), n0(p.rShow), n0(p.rClose)].map(x => x / 100);
  const total = perDay * days;
  const steps = [total]; r.forEach((x, i) => steps.push(steps[i] * x));
  const prodR = r.reduce((a, b) => a * b, 1);
  const vendasPrev = steps[5];
  const vendasNec = ticket > 0 ? Math.ceil(meta / ticket) : 0;
  const perDayNeeded = prodR > 0 ? Math.ceil(vendasNec / prodR / days) : NaN;
  return { total, steps, vendasPrev, fat: vendasPrev * ticket, vendasNec, perDayNeeded, prodR };
}

          <text x=${padL + i * gw + gw / 2} y=${H - 6} text-anchor="middle">${lb}</text>

            onMouseMove=${e => showTip(e, html`<div><b>${lb}</b>${series.map(s => html`<div key=${s.name}><span class="dot" style=${{ background: s.color, marginRight: 6 }}/>${s.name}: <b>${f(s.data[i] || 0)}</b></div>`)}${line && html`<div>${line.name}: <b>${f(line.data[i] || 0)}</b></div>`}</div>`)}
            onMouseLeave=${hideTip}/>
        </g>`;
  })}
      ${refLine && html`<g pointer-events="none"><line x1=${padL} x2=${W} y1=${y(refLine.v)} y2=${y(refLine.v)} stroke=${refLine.color} stroke-width="2" stroke-dasharray="6 4"/><text x=${W} y=${y(refLine.v) - 5} text-anchor="end" style=${{ fill: refLine.color, fontWeight: 700 }}>${refLine.name}</text></g>`}
      ${line && html`<g pointer-events="none"><polyline fill="none" stroke=${line.color} stroke-width="2" points=${line.data.map((v, i) => (padL + i * gw + gw / 2) + ',' + y(v || 0)).join(' ')}/>
        ${line.data.map((v, i) => html`<circle key=${i} cx=${padL + i * gw + gw / 2} cy=${y(v || 0)} r="4" fill=${line.color} stroke="var(--surface)" stroke-width="2"/>`)}</g>`}
    </svg>
    ${(series.length > 1 || line || refLine) && html`<div class="legend">${series.map(s => html`<span key=${s.name}><i style=${{ background: s.color }}/>${s.name}</span>`)}${line && html`<span><i style=${{ background: line.color, height: 3 }}/>${line.name}</span>`}${refLine && html`<span><i style=${{ background: refLine.color, height: 3 }}/>${refLine.name}</span>`}</div>`}
  </div>`;
}

/* barras horizontais de funil (como a calculadora de prospecção) */
function FunnelBars({ rows, fmt }) {
  const max = Math.max(1, ...rows.map(r => r.v || 0));
  const f = fmt || (v => num(v, v > 0 && v < 10 && v % 1 ? 1 : 0));
  return html`<div>${rows.map((r, i) => html`<div class="fun-row" key=${r.l}>
    <div class="lb">${r.l}</div>
    <div class=${'fun-bar' + ((r.v || 0) / max > 0.25 ? ' first' : '')} onMouseMove=${e => showTip(e, html`<div><b>${r.l}</b>: ${f(r.v || 0)}${r.rate != null ? ' · ' + pct(r.rate) + ' da etapa anterior' : ''}</div>`)} onMouseLeave=${hideTip}>
      <i style=${{ width: clamp(((r.v || 0) / max) * 100, 0, 100) + '%', background: r.c || 'var(--primary-2)' }}/>
      <span>${f(r.v || 0)}${r.rate != null && html`<span style=${{ opacity: .85, fontWeight: 600 }}> · ${pct(r.rate)}</span>`}</span>
    </div></div>`)}</div>`;
}

/* lista de seleção rápida de pessoa/cliente */
function Avatar({ name, size = 30 }) {

  return html`<span style=${{ width: size, height: size, borderRadius: '50%', background: `var(--s${h})`, color: '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: size * 0.38, fontWeight: 700, flex: 'none' }}>${initials(name)}</span>`;

function copyText(t) {

/* ---------- gráfico de linhas (eixo único, base zero) ---------- */
function LineChart({ labels, series, h = 200, fmt }) {
  const W = 640, H = h, padL = 54, padB = 24, padT = 12, padR = 14;
  const maxV = Math.max(1, ...series.flatMap(s => s.data.map(v => v || 0)));
  const p10 = Math.pow(10, Math.floor(Math.log10(maxV))); const top = Math.ceil(maxV / p10) * p10;
  const n = labels.length;
  const x = i => (n <= 1 ? padL + (W - padL - padR) / 2 : padL + i * (W - padL - padR) / (n - 1));
  const y = v => padT + (H - padT - padB) * (1 - (v || 0) / top);
  const f = fmt || (v => num(v));
  const [hov, setHov] = useState(null);
  return html`<div>
    <svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label=${series.map(s => s.name).join(', ')} onMouseLeave=${() => { setHov(null); hideTip(); }}>
      ${[0, top / 2, top].map(t => html`<g key=${t}><line class=${t === 0 ? 'axis-0' : 'grid-l'} x1=${padL} x2=${W - padR} y1=${y(t)} y2=${y(t)}/><text x=${padL - 8} y=${y(t) + 4} text-anchor="end">${f(t)}</text></g>`)}
      ${labels.map((lb, i) => (n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1) && html`<text key=${'l' + i} x=${x(i)} y=${H - 6} text-anchor="middle">${lb}</text>`)}
      ${hov != null && html`<line x1=${x(hov)} x2=${x(hov)} y1=${padT} y2=${H - padB} stroke="var(--border-strong)" stroke-width="1"/>`}
      ${series.map(s => html`<g key=${s.name}><polyline fill="none" stroke=${s.color} stroke-width="2" stroke-linejoin="round" points=${s.data.map((v, i) => x(i) + ',' + y(v)).join(' ')}/>
        ${s.data.map((v, i) => html`<circle key=${i} cx=${x(i)} cy=${y(v)} r=${hov === i ? 5 : 3.5} fill=${s.color} stroke="var(--surface)" stroke-width="2"/>`)}</g>`)}
      ${labels.map((lb, i) => html`<rect key=${'h' + i} x=${x(i) - (W - padL) / Math.max(1, n) / 2} y=${padT} width=${(W - padL) / Math.max(1, n)} height=${H - padT - padB} fill="transparent"
        onMouseMove=${e => { setHov(i); showTip(e, html`<div><b>${lb}</b>${series.map(s => html`<div key=${s.name}><span class="dot" style=${{ background: s.color, marginRight: 6 }}/>${s.name}: <b>${f(s.data[i] || 0)}</b></div>`)}</div>`); }}/>`)}
    </svg>
    ${series.length > 1 && html`<div class="legend">${series.map(s => html`<span key=${s.name}><i style=${{ background: s.color }}/>${s.name}</span>`)}</div>`}
  </div>`;
}

   COMERCIAL — CRM, follow-up/cadências, prospecção, análise
   ============================================================ */
const chName = (S, id) => (S.channels.find(c => c.id === id) || {}).name || '—';
const prodName = (S, id) => (S.products.find(p => p.id === id) || {}).name || '—';
const prodOf = (S, id) => S.products.find(p => p.id === id);
const memberName = (S, id) => (S.team.find(t => t.id === id) || {}).name || '';
const cadFor = (S, chId) => { const k = (S.channels.find(c => c.id === chId) || {}).kind; return k === 'outbound' ? 'cad_outbound' : (k === 'pago' || k === 'inbound' || k === 'indicacao') ? 'cad_inbound' : ''; };
const scriptVars = (d, me) => ({ nome: (d.name || '').split(' ')[0], empresa: d.company || 'sua empresa', eu: me || '' });

/* ---------- ações sobre leads ---------- */
function logActivity(d, type, text, extra) {
  const a = Object.assign({ id: uid(), type, text, at: stamp(), by: CURRENT_USER.id }, extra || {});
  return { activities: [a].concat(d.activities || []), lastTouch: a.at };
}
function bumpProspect(chId, metric, n = 1) {
  if (!chId) return;
  const id = prospectDocId(today(), CURRENT_USER.id);
  const cur = store.data.prospect[id] || { id, date: today(), user: CURRENT_USER.id, byCh: {} };
  const byCh = Object.assign({}, cur.byCh); const m = Object.assign({}, byCh[chId] || {});
  m[metric] = Math.max(0, (Number(m[metric]) || 0) + n); byCh[chId] = m;
  store.put('prospect', Object.assign({}, cur, { byCh }));
}
function startCadence(d, cadId) {
  const cad = store.data.cadences[cadId]; if (!cad) return {};
  const st = (cad.steps || [])[0];
  return { cadenceId: cadId, cadenceStep: 0, cadenceStart: today(), cadenceDue: nextBiz(addDays(today(), st ? st.day || 0 : 0)), cadencePaused: false };
}
function moveDeal(d, to, extra) {
  const patch = Object.assign(stagePatch(d, to), extra || {});
  const add = logActivity(d, 'nota', 'Etapa: ' + stageOf(d.stage).l + ' → ' + stageOf(to).l, { sys: true });
  Object.assign(patch, add);
  if (to === 'conexao' && d.cadenceId === 'cad_outbound') { patch.cadenceId = null; patch.nextAction = 'Qualificar e agendar reunião'; patch.nextDate = addDays(today(), 1); }
  if (to === 'agendada' || to === 'realizada') { patch.cadenceId = null; }
  if (to === 'realizada') { patch.nextAction = d.nextAction && d.stage === 'realizada' ? d.nextAction : 'Enviar proposta'; patch.nextDate = addDays(today(), 1); }
  if (to === 'proposta' && store.data.cadences.cad_proposta && d.cadenceId !== 'cad_proposta') Object.assign(patch, startCadence(d, 'cad_proposta'));
  store.put('deals', Object.assign({}, d, patch));
  if (to === 'proposta') toast('Cadência "Pós-reunião / Proposta" iniciada para ' + d.name + '.');
}
function completeStep(d, outcome) {
  const db = { ...store.data, S: settingsOf(store.data) };
  const t = nextTask(db, d);
  if (!t || t.kind === 'none') return;
  let patch = {};
  if (t.kind === 'cad') {
    const st = t.step;
    Object.assign(patch, logActivity(d, st.ch, 'Passo ' + (t.i + 1) + '/' + t.total + ' — ' + st.title + (outcome === 'respondeu' ? ' · respondeu ✅' : '')));
    bumpProspect(d.channelId, t.i === 0 && (d.stage === 'novo' || d.stage === 'contato') && !d.firstTouch ? 'abord' : 'fup');
    if (t.i === 0) patch.firstTouch = true;
    if (outcome === 'respondeu') {
      bumpProspect(d.channelId, 'resp');
      Object.assign(patch, { cadenceId: null, nextAction: 'Qualificar e agendar reunião', nextDate: today() });
      if (stageIdx(d.stage) < stageIdx('conexao')) Object.assign(patch, stagePatch(Object.assign({}, d, patch), 'conexao'));
      toast(d.name + ' respondeu! Movido para "Conectado".');
    } else {
      const nx = t.cad.steps[t.i + 1];
      if (nx) {
        const gap = Math.max(0, (nx.day || 0) - (st.day || 0));
        Object.assign(patch, { cadenceStep: t.i + 1, cadenceDue: nextBiz(addDays(today(), gap)) });
      } else {
        Object.assign(patch, { cadenceId: null, nextAction: 'Cadência concluída sem resposta — perder ou nutrir?', nextDate: today() });
      }
      if (d.stage === 'novo') Object.assign(patch, stagePatch(Object.assign({}, d, patch), 'contato'));
    }
  } else {
    Object.assign(patch, logActivity(d, 'nota', 'Feito: ' + (t.title || 'próxima ação')), { nextAction: '', nextDate: '' });
    if (d.stage === 'perdido') patch.reactivateAt = '';
  }
  store.put('deals', Object.assign({}, d, patch));
}
function snooze(d, days) {
  const db = { ...store.data, S: settingsOf(store.data) };
  const t = nextTask(db, d); if (!t) return;
  const nd = nextBiz(addDays(today(), days));
  if (t.kind === 'cad') store.put('deals', Object.assign({}, d, { cadenceDue: nd }));
  else if (d.stage === 'perdido') store.put('deals', Object.assign({}, d, { reactivateAt: nd }));
  else store.put('deals', Object.assign({}, d, { nextDate: nd }));
  toast('Adiado para ' + fdateShort(nd) + '.');
}

function InvRow({ i, onClick }) {

      <div class="xs faint row" style=${{ gap: 6, flexWrap: 'wrap' }}><${Tag} t=${t} style=${{ fontSize: 10.5, padding: '0 6px' }}>${l}</${Tag}><${BillingBadge} i=${i}/><span>${i.label}${i.billing === 'asaas' ? (i.asaas ? ' · ' + (ASAAS_LABEL[i.asaas.status] || i.asaas.status) : '') : ' · ' + methodL(i.method)}${i.status === 'pago' ? ' · recebido ' + fdate(i.paidAt) : ''}</span></div></div>
    <div class="num b" style=${{ textAlign: 'right', whiteSpace: 'nowrap' }}>${i.amountOrig != null && i.status !== 'pago' ? html`<span>${moneyCur(i.amountOrig, i.currency)}<div class="xs faint" style=${{ fontWeight: 500 }}>≈ ${money(i.amount)}</div></span>` : money(i.status === 'pago' ? i.paidAmount : i.amount, true)}</div>
    <${InvActions} i=${i}/>
    ${i.status !== 'pago' && i.status !== 'cancelado' ? html`<${Btn} sz="xs" v="good" icon="check" on=${() => quickPay(i)} title="Marcar como recebido hoje">Recebido</${Btn}>` : html`<${Btn} sz="xs" v="ghost" on=${() => setPay(true)}>Detalhes</${Btn}>`}

function netOf(i) { const S = settingsOf(store.data); return i.method === 'cartao' && S.cardFee ? Math.round(i.amount * (1 - S.cardFee / 100) * 100) / 100 : i.amount; }
function quickPay(i) {
  if (i.billing === 'asaas' && i.asaas && !i.asaas.deleted && !confirm('Esta cobrança está no Asaas. Se o cliente pagou por lá, a baixa é automática. Dar baixa manual mesmo assim? (Depois, em Cobranças, você pode dar baixa no Asaas também para ele não cobrar de novo.)')) return;
  const prev = store.data.payments[i.id];
  store.put('payments', Object.assign({}, prev || {}, { id: i.id, contractId: i.contractId, status: 'pago', paidAt: today(), paidAmount: netOf(i) }));
  toast('Recebimento de ' + money(netOf(i), true) + ' registrado.', { l: 'Desfazer', f: () => prev ? store.restore('payments', prev) : store.del('payments', i.id) });
}
function PayModal({ i, onClose }) {

      <${Kpi} l=${'Recebido em ' + monthShort(ym)} v=${money(sum(recMes, i => i.paidAmount))} tone="good"/>

/* ---------- resumo do mês em linguagem clara ---------- */
const isInadimplente = i => i.status === 'atrasado' && i.due < ymNow() + '-01';
function MonthSummary({ db, ym, inv, f, nav }) {
  const S = db.S;
  const [open, setOpen] = useState(LS.get('vos7_fin_open', { ativos: true, aviso: true, outros: true, desp: true }));
  const tog = k => { const n = { ...open, [k]: !open[k] }; setOpen(n); LS.set('vos7_fin_open', n); };
  const monthEnd = ym + '-' + pad(daysInMonth(ym));
  const rec = vals(db.contracts).filter(c => contractActiveIn(c, ym));
  const emAviso = c => !!c.endDate;
  const ativos = rec.filter(c => !emAviso(c)).sort((a, b) => brlValue(b) - brlValue(a));
  const aviso = rec.filter(emAviso).sort((a, b) => (a.endDate || '').localeCompare(b.endDate || ''));
  const mrrAtivo = sum(ativos, brlValue), mrrAviso = sum(aviso, brlValue);
  const doMes = inv.filter(i => i.ym === ym && i.status !== 'cancelado');
  const byContract = groupBy(doMes, i => i.contractId);
  const recIds = new Set(rec.map(c => c.id));
  const outros = doMes.filter(i => !recIds.has(i.contractId) || i.kind !== 'mensal').sort((a, b) => a.due.localeCompare(b.due));
  const desp = f.custos.slice().sort((a, b) => b.amount - a.amount);
  const res = f.caixa - f.despesas - f.imposto;
  const pend = doMes.filter(i => i.status !== 'pago');
  const inad = inv.filter(isInadimplente);
  const statusOf = c => { const l = (byContract[c.id] || []).filter(i => i.kind === 'mensal'); if (!l.length) return null; const pg = l.every(i => i.status === 'pago'); const at = l.some(i => i.status === 'atrasado'); return pg ? ['good', 'pago'] : at ? ['bad', 'atrasado'] : ['', 'a receber']; };
  const Box = ({ t, v, s, tone, icon }) => html`<div class="kpi"><div class="l">${icon && html`<${Icon} n=${icon} s=${14}/>`}${t}</div><div class="v" style=${tone ? { color: 'var(--' + tone + ')' } : null}>${v}</div><div class="s" style=${{ color: 'var(--text-2)' }}>${s}</div></div>`;
  const Group = ({ k, title, total, tone, children, hint }) => html`<div class="mb12">
    <button class="row between" style=${{ width: '100%', border: 0, background: 'none', padding: '6px 0', cursor: 'pointer' }} onClick=${() => tog(k)}>
      <span class="xs b" style=${{ letterSpacing: '.08em', textTransform: 'uppercase', color: tone ? 'var(--' + tone + ')' : 'var(--text-2)' }}>${open[k] ? '▾' : '▸'} ${title}</span><b class="num small">${total}</b></button>
    ${hint && open[k] && html`<div class="xs faint mb8">${hint}</div>`}
    ${open[k] && children}</div>`;
  const Row = ({ name, sub, val, tag, onClick, border }) => html`<div class="row" style=${{ padding: '8px 12px', borderLeft: '3px solid ' + (border || 'var(--border)'), background: 'var(--surface-2)', borderRadius: '0 8px 8px 0', marginBottom: 4, cursor: onClick ? 'pointer' : null }} onClick=${onClick}>
    <div style=${{ flex: 1, minWidth: 0 }}><div class="small b ellipsis">${name}</div>${sub && html`<div class="xs faint ellipsis">${sub}</div>`}</div>
    ${tag && html`<${Tag} t=${tag[0]} style=${{ fontSize: 10.5 }}>${tag[1]}</${Tag}>`}<b class="num small" style=${{ minWidth: 90, textAlign: 'right' }}>${val}</b></div>`;
  return html`<div>
    <div class="grid g5 mb12">
      <${Box} icon="repeat" t="MRR ativo" v=${money(mrrAtivo)} s=${ativos.length + ' clientes que continuam (mensalidade de cada mês)'} tone="good"/>
      <${Box} icon="alert" t="Em aviso" v=${money(mrrAviso)} s=${aviso.length ? aviso.length + ' saindo: pagam até o fim do aviso e depois saem do MRR' : 'ninguém saindo'} tone=${aviso.length ? 'warn' : null}/>
      <${Box} icon="wallet" t="Receita real (caixa)" v=${money(f.caixa)} s=${'O que caiu na conta em ' + monthShort(ym) + (pend.length ? ' · faltam ' + money(sum(pend, i => i.amount)) : '')} tone="good"/>
      <${Box} icon="down" t="Despesas" v=${money(f.despesas + f.imposto)} s=${'O que saiu: ' + f.custos.length + ' lançamentos'}/>
      <${Box} icon="dollar" t="Resultado" v=${money(res)} s="Receita real − despesas" tone=${res >= 0 ? 'good' : 'bad'}/>
    </div>
    ${inad.length > 0 && html`<div class="callout warn mb16 row between" style=${{ gap: 12 }}><div><b class="t">Inadimplência (fora das contas acima): ${money(sum(inad, i => i.amount))}</b>${inad.length} cobranças vencidas antes de ${monthLabel(ymNow())}. Não entram em "a receber" para não inflar o mês.</div><${Btn} sz="sm" on=${() => { LS.set('vos7_rec_tab', 'inad'); nav.go('recebiveis'); }}>Ver inadimplentes</${Btn}></div>`}
    <div class="grid g2 mb16" style=${{ alignItems: 'start' }}>
      <div class="card">

/* ---------- de onde vem a receita (por produto) ---------- */
function suggestProduct(c, S) {
  const has = id => S.products.some(p => p.id === id);
  const txt = (c.notes || '').toLowerCase(); // só as observações do contrato (o nome do cliente engana)
  let s = '';
  if (/consultoria 360|\b360\b/.test(txt)) s = 'c360';
  else if (/rede|social|conteúdo|conteudo/.test(txt)) s = 'social';
  else if (/\bia\b|intelig|humaniz/.test(txt)) s = 'ia';
  else if (/sistema|crm/.test(txt) && c.kind === 'projeto') s = 'sistemas';
  else if (c.kind === 'recorrente' || c.kind === 'espelho') {
    if (c.currency && c.currency !== 'BRL') s = 'trafego_eua';
    else if (Math.abs(n0(c.value) - 197) < 1) s = 'tracking';
    else s = 'trafego';
  } else if (c.kind === 'projeto') {
    const v = n0(c.value) * fxRate(c);
    if (v >= 7000) s = 'sistemas'; else if (v >= 4500 && v < 7000) s = 'c360';
  }
  return has(s) ? s : '';
}
const productShares = c => {

  const tot = sum(mix, m => m.value);
  return mix.length && tot > 0 ? mix.map(m => ({ id: m.productId, share: n0(m.value) / tot })) : [{ id: c.productId, share: 1 }];
};
function RevenueByProduct({ db, ym, inv, nav }) {

  const tot = { mrr: sum(list, r => r.mrr), prev: sum(list, r => r.prev), rec: sum(list, r => r.rec), comp: sum(list, r => r.comp) };

      <div class="small"><b>MRR</b><div class="muted">Soma das mensalidades dos contratos ativos e em aviso. É a "receita que se repete todo mês". Não conta projetos.</div></div>

const ASAAS_SECRET_KEY = 'vos7_asaas_secret';
const asaasReady = S => S.asaas && S.asaas.enabled && !!LS.get(ASAAS_SECRET_KEY, '');
async function asaasCall(action, params) {
  const S = settingsOf(store.data);
  const r = await fetch(S.asaas.proxyUrl || '/.netlify/functions/asaas', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-vos-secret': LS.get(ASAAS_SECRET_KEY, '') },
    body: JSON.stringify({ action, params })
  }).catch(() => { throw new Error('Não consegui falar com a função do Asaas. O sistema precisa estar publicado no Netlify (veja Configurações → Asaas).'); });
  let data = null; try { data = await r.json(); } catch (e) { /* vazio */ }
  if (!r.ok) throw new Error((data && data.error) || (r.status === 404 ? 'Função do Asaas não encontrada (404). Confira se o site foi publicado pelo Netlify a partir do GitHub.' : r.status >= 500 ? 'A função do Netlify falhou (erro ' + r.status + '). Veja em Netlify → Logs → Functions → asaas.' : 'Erro ' + r.status));
  return data;
}
const saveAsaasSnap = s => { if (s && s.id) store.restore('asaas', Object.assign({}, store.data.asaas[s.id] || {}, s)); };

async function emitInvoice(i) {
  const db = { ...store.data, S: settingsOf(store.data) };
  const c = db.contracts[i.contractId]; const cl = db.clients[i.clientId] || {};
  if (!onlyDigits(cl.document) && !cl.asaasId) throw new Error(i.clientName + ': cadastre o CPF/CNPJ do cliente (Clientes → editar).');
  let customer = cl.asaasId;
  if (!customer) {
    const r = await asaasCall('findOrCreateCustomer', { name: cl.name || i.clientName, cpfCnpj: cl.document, email: cl.email, phone: cl.phone, externalReference: cl.id });
    customer = r.id; store.put('clients', Object.assign({}, cl, { asaasId: customer }));
  }
  const dbNow = { ...store.data, S: settingsOf(store.data) };
  const dup = suggestLinks(dbNow, [i]).find(x => x.a.customer === customer);
  if (dup) { linkInvoice(i, dup.a); return dup.a; } // já existe no Asaas (ex.: assinatura): só vincula, não duplica
  const due = i.due < today() ? today() : i.due;
  const snap = await asaasCall('createPayment', {
    customer, billingType: (c && c.asaasBilling) || db.S.asaas.billingType || 'UNDEFINED', value: i.amount, dueDate: due,
    description: prodName(db.S, i.productId) + ' — ' + i.label + ' — ' + (db.S.company || 'Visions'), externalReference: i.id
  });
  saveAsaasSnap(snap);
  return snap;
}
async function syncAsaas() {
  const [r, rc] = await Promise.all([asaasCall('listPayments', { dueFrom: addDays(today(), -200), dueTo: addDays(today(), 120) }), asaasCall('listCustomers', {}).catch(() => ({ customers: [] }))]);
  const cust = {}; (rc.customers || []).forEach(c => (cust[c.id] = c));
  let changed = 0;
  (r.payments || []).forEach(p => {
    const c = cust[p.customer]; if (c) { p.customerName = c.name; p.customerDoc = c.cpfCnpj || ''; }
    const cur = store.data.asaas[p.id];
    if (!cur || cur.status !== p.status || cur.value !== p.value || cur.dueDate !== p.dueDate || cur.paymentDate !== p.paymentDate || !!cur.deleted !== !!p.deleted || (p.customerName && cur.customerName !== p.customerName)) { saveAsaasSnap(p); changed++; }
  });
  store.setSettings({ asaasLastSync: stamp() });
  const auto = autoLinkStrong();
  return { total: (r.payments || []).length, changed, auto };
}
/* ---------- vínculo de cobranças do Asaas com o contrato ---------- */
const STOP = new Set(['ltda', 'me', 'mei', 'eireli', 'sa', 'epp', 'de', 'da', 'do', 'dos', 'das', 'e', 'cia', 'servicos', 'comercio']);
const nameTokens = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !STOP.has(w));
function nameScore(a, b) { const A = new Set(nameTokens(a)), B = new Set(nameTokens(b)); if (!A.size || !B.size) return 0; let n = 0; A.forEach(w => B.has(w) && n++); return n / Math.min(A.size, B.size); }
function suggestLinks(db, inv) {
  const linked = linkedAsaasIds(db); const refs = new Set(inv.map(i => i.id));
  const free = inv.filter(i => !i.asaas && i.status !== 'cancelado' && !(db.payments[i.id] && db.payments[i.id].asaasId));
  const used = new Set(); const out = [];
  const perCustMonth = {}; vals(db.asaas).filter(a => !a.deleted && !linked.has(a.id) && !refs.has(a.externalReference)).forEach(a => { const k = a.customer + '|' + ymOf(a.originalDueDate || a.dueDate); perCustMonth[k] = (perCustMonth[k] || 0) + 1; });
  vals(db.asaas).filter(a => !a.deleted && !linked.has(a.id) && !refs.has(a.externalReference))
    .sort((x, y) => (x.dueDate || '').localeCompare(y.dueDate || ''))
    .forEach(a => {
      const am = ymOf(a.originalDueDate || a.dueDate);
      let best = null;
      free.forEach(i => {
        if (used.has(i.id)) return;
        if (i.origYm !== am && i.ym !== am) return;
        const cl = db.clients[i.clientId] || {};
        const idMatch = cl.asaasId && cl.asaasId === a.customer;
        const docMatch = onlyDigits(cl.document) && onlyDigits(cl.document) === onlyDigits(a.customerDoc);
        const sameValue = Math.abs(Number(a.value) - i.amount) <= Math.max(1, i.amount * 0.02);
        // valor diferente: só sugere (nunca automático) e só se for a única cobrança desse cliente no mês
        const near = Math.abs(Number(a.value) - i.amount) <= i.amount * 0.3; // reajuste/desconto, não outro serviço
        if (!sameValue && !((idMatch || docMatch) && near && i.kind === 'mensal' && (perCustMonth[a.customer + '|' + am] || 0) === 1)) return;
        const ns = Math.max(nameScore(a.customerName, i.clientName), nameScore(a.customerName, cl.contact), nameScore(a.description, i.clientName) * 0.8);
        if (!idMatch && !docMatch && ns < 0.6) return;
        const score = (idMatch ? 3 : 0) + (docMatch ? 3 : 0) + ns + (sameValue ? 1 : 0) + (Math.abs(Number(a.value) - i.amount) < 0.01 ? 0.5 : 0);
        if (!best || score > best.score) best = { a, i, score, strong: !!(idMatch || docMatch) && sameValue, why: (idMatch ? 'mesmo cliente no Asaas' : docMatch ? 'mesmo CPF/CNPJ' : 'nome parecido') + (sameValue ? '' : ' · valor diferente (vale o do Asaas)') };
      });
      if (best) { used.add(best.i.id); out.push(best); }
    });
  return out;
}
function linkInvoice(i, a) {
  const db = store.data; const prev = db.payments[i.id] || {};
  store.put('payments', Object.assign({}, prev, { id: i.id, contractId: i.contractId, asaasId: a.id }));
  const c = db.contracts[i.contractId]; if (c && c.billing !== 'asaas') store.put('contracts', Object.assign({}, c, { billing: 'asaas' }));
  const cl = db.clients[i.clientId];
  if (cl && (cl.asaasId !== a.customer || (!cl.document && a.customerDoc))) store.put('clients', Object.assign({}, cl, { asaasId: a.customer, document: cl.document || a.customerDoc || '' }));
}
function autoLinkStrong() {
  const db = { ...store.data, S: settingsOf(store.data) };
  const sug = suggestLinks(db, allInvoices(db, addMonths(ymNow(), 2))).filter(x => x.strong);
  sug.forEach(x => linkInvoice(x.i, x.a));
  return sug.length;
}

  try { const r = await fn(); return r; } catch (e) { toast('Asaas: ' + e.message, null, 8000); throw e; }
}

const REMIND_LATE = { pt: 'Notamos que ainda não identificamos o pagamento. ', en: "We haven't received this payment yet. ", es: 'Aún no identificamos el pago. ' };
function ReminderModal({ i, onClose }) {
  const db = useDB(); const c = db.contracts[i.contractId] || {}; const cl = db.clients[i.clientId] || {};
  const [lang, setLang] = useState(c.reminderLang || (i.currency !== 'BRL' ? 'en' : 'pt'));
  const nome = (cl.contact || cl.name || i.clientName || '').split(' ')[0];
  const loc = { pt: 'pt-BR', en: 'en-US', es: 'es-ES' }[lang];
  const valor = new Intl.NumberFormat(loc, { style: 'currency', currency: i.amountOrig != null ? i.currency : 'BRL' }).format(i.amountOrig != null ? i.amountOrig : i.amount);
  const descMap = { pt: i.label.toLowerCase(), en: i.kind === 'mensal' ? 'monthly fee (' + monthShort(i.origYm) + ')' : 'invoice (' + i.label + ')', es: i.kind === 'mensal' ? 'mensualidad (' + monthShort(i.origYm) + ')' : 'factura (' + i.label + ')' };
  const venc = lang === 'en' ? parseD(i.due).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : fdate(i.due);
  let txt = REMIND_TPL[lang]({ nome, desc: descMap[lang], valor, venc, link: c.payLink, instr: c.payInstructions });
  if (i.status === 'atrasado') txt = txt.replace(/\n\n/, '\n\n' + REMIND_LATE[lang]);
  const [msg, setMsg] = useState(txt);
  useEffect(() => setMsg(txt), [lang]);
  const log = ch => { const p = db.payments[i.id] || { id: i.id, contractId: i.contractId }; store.put('payments', Object.assign({}, p, { reminders: (p.reminders || []).concat({ at: stamp(), ch, by: CURRENT_USER.id }) })); };
  const phone = cl.phone || c.phone; const email = cl.email || c.email;
  return html`<${Modal} title=${'Lembrete — ' + i.clientName} onClose=${onClose}
    footer=${html`<${Btn} icon="copy" on=${() => { copyText(msg); log('copiado'); }}>Copiar</${Btn}>
      ${email && html`<${Btn} icon="msg" href=${'mailto:' + email + '?subject=' + encodeURIComponent(lang === 'en' ? 'Payment reminder' : lang === 'es' ? 'Recordatorio de pago' : 'Lembrete de pagamento') + '&body=' + encodeURIComponent(msg)} on=${() => log('email')}>E-mail</${Btn}>`}
      ${phone && html`<${Btn} cls="wa" icon="msg" href=${waLink(phone, msg)} on=${() => log('whatsapp')}>WhatsApp</${Btn}>`}`}>
    <div class="row between mb12"><${Seg} v=${lang} on=${setLang} opts=${[{ v: 'pt', l: 'Português' }, { v: 'en', l: 'English' }, { v: 'es', l: 'Español' }]}/>
      <span class="xs faint">${i.reminders.length ? i.reminders.length + ' lembrete(s) enviados · último ' + fdate(dOfStamp(i.reminders[i.reminders.length - 1].at)) : 'nenhum lembrete enviado'}</span></div>
    <${Textarea} v=${msg} on=${setMsg} rows=${9}/>
    ${!c.payLink && html`<div class="xs faint mt8">Dica: cadastre no contrato o link de pagamento (Wise, PayPal, Stripe…) para ele entrar no lembrete automaticamente.</div>`}
  </${Modal}>`;
}

function InvActions({ i }) {

/* ---------- página Cobranças ---------- */

  const ready = asaasReady(S);

  const toEmit = (by.nao_emitida || []).map(x => x.i);

  const suggIds = new Set(sugg.map(x => x.a.id));

  };

    if ((x.type === 'atrasada' || x.type === 'inadimplente') && i.billing !== 'asaas') return html`<${InvActions} i=${i}/>`;

    ${!ready && html`<div class="callout info mb16"><b class="t">Asaas ainda não conectado</b>A conciliação abaixo já funciona com os dados manuais. Para emitir cobranças e receber a baixa automática quando o cliente paga, conecte em <a href="#config" onClick=${e => { e.preventDefault(); nav.go('config'); LS.set('vos7_cfgtab', 'asaas'); }}>Configurações → Asaas</a>.</div>`}
    <div class="grid g4 mb16">
      <${Kpi} l="Alertas de cobrança" v=${issues.filter(x => ISSUE_TYPES[x.type].t !== 'info').length} tone=${issues.some(x => ISSUE_TYPES[x.type].t === 'bad') ? 'bad' : null} icon="alert"/>
      <${Kpi} l="Atrasado neste mês" v=${money(sum((by.atrasada || []).map(x => x.i), i => i.amount))} s=${(by.atrasada || []).length + ' cobranças · inadimplência à parte: ' + money(sum((by.inadimplente || []).map(x => x.i), i => i.amount))}/>

      <${Kpi} l="Exterior a receber (30 dias)" v=${Object.entries(extByCur).map(([cur, l]) => moneyCur(sum(l, i => i.amountOrig ?? i.amount), cur)).join(' + ') || '—'} s=${ext.length + ' cobranças · ≈ ' + money(sum(ext, i => i.amount))}/>

      <div class="lgroup" style=${{ color: 'var(--primary)' }}><span>Encontrei no Asaas cobranças destes contratos (${sugg.length})</span>
        <span style=${{ textTransform: 'none', letterSpacing: 0 }}><${Btn} sz="xs" v="pri" on=${() => linkAll(sugg)}>Vincular todas</${Btn}></span></div>
      <div class="small muted" style=${{ padding: '8px 14px' }}>Mesmo mês, mesmo valor e cliente parecido. Ao vincular, o status do Asaas (pago, vencido…) passa a valer aqui e as próximas cobranças desse cliente são ligadas sozinhas.</div>
      ${sugg.slice(0, 60).map(x => html`<div class="lrow" key=${x.a.id}>
        <div style=${{ flex: 1, minWidth: 0 }}><div class="main-t ellipsis">${x.i.clientName} · ${x.i.label}</div><div class="xs faint">Contrato: ${money2(x.i.amount)} · vence ${fdate(x.i.due)}</div></div>
        <div style=${{ flex: 1, minWidth: 0 }}><div class="small ellipsis">↔ Asaas: <b>${x.a.customerName || x.a.description || x.a.id}</b></div><div class="xs faint">${money2(x.a.value)} · vence ${fdate(x.a.dueDate)} · ${ASAAS_LABEL[x.a.status] || x.a.status} · ${x.why}</div></div>

  </div>`;
}

/* ---------- baixa em lote ---------- */
function BulkPayModal({ list, onClose }) {
  const [sel, setSel] = useState(() => new Set(list.map(i => i.id)));
  const [mode, setMode] = useState('venc'); const [d, setD] = useState(today());
  const toggle = id => setSel(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const chosen = list.filter(i => sel.has(i.id));
  const save = () => {
    const prevs = chosen.map(i => store.data.payments[i.id] || null);
    chosen.forEach(i => { const prev = store.data.payments[i.id] || {}; store.put('payments', Object.assign({}, prev, { id: i.id, contractId: i.contractId, status: 'pago', paidAt: mode === 'venc' ? i.due : mode === 'hoje' ? today() : d, paidAmount: netOf(i), note: prev.note || 'baixa em lote' })); });
    toast(chosen.length + ' cobrança(s) marcadas como recebidas.', { l: 'Desfazer', f: () => chosen.forEach((i, k) => (prevs[k] ? store.restore('payments', prevs[k]) : store.del('payments', i.id))) }, 10000);

/* ---------- cotação automática (USD, EUR, GBP → BRL) ---------- */
async function updateFx(force) {
  const S = settingsOf(store.data);
  if (S.fxAuto === false && !force) return null;
  if (!force && S.fxUpdatedAt && Date.now() - new Date(S.fxUpdatedAt).getTime() < 6 * 3600e3) return null;
  try {
    const r = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,GBP-BRL', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const fx = Object.assign({}, S.fx);
    [['USD', 'USDBRL'], ['EUR', 'EURBRL'], ['GBP', 'GBPBRL']].forEach(([k, q]) => { const v = j[q] && parseFloat(j[q].bid); if (v > 0) fx[k] = Math.round(v * 10000) / 10000; });
    store.setSettings({ fx, fxUpdatedAt: stamp() });
    return fx;
  } catch (e) { if (force) toast('Não consegui buscar a cotação agora (' + e.message + '). Os valores atuais continuam valendo.'); return null; }
}

/* ---------- contrato espelho: acompanha todas as cobranças de um cliente do Asaas ---------- */
function createMirror(a) {
  const db = store.data;
  if (vals(db.contracts).some(c => c.kind === 'espelho' && c.asaasCustomer === a.customer)) return toast('Este cliente do Asaas já é acompanhado.');
  const name = prompt('Nome do cliente no Visions OS:', a.customerName || '');
  if (!name) return;
  let cl = vals(db.clients).find(c => (c.name || '').trim().toLowerCase() === name.trim().toLowerCase());
  cl = store.put('clients', Object.assign({}, cl || { name: name.trim(), since: a.dueDate }, { asaasId: a.customer, document: (cl && cl.document) || a.customerDoc || '' }));
  const first = vals(db.asaas).filter(x => x.customer === a.customer).map(x => x.dueDate).sort()[0] || a.dueDate;
  store.put('contracts', { clientId: cl.id, clientName: cl.name, kind: 'espelho', billing: 'asaas', asaasCustomer: a.customer, value: 0, startDate: first, productId: '', notes: 'Espelho do Asaas', ownerId: CURRENT_USER.id });
  toast(cl.name + ': todas as cobranças do Asaas agora aparecem em Recebíveis.');
}

/* --------- calculadora de metas & CAC --------- */
function realBaseline(db, months = 3) {
  const end = today(); const start = addDays(end, -30 * months);
  const ev = funnelEvents(db, start, end);
  const cm = [0, 1, 2].map(i => addMonths(ymNow(), -i));
  const spend = sum(cm, m => spendOf(db, m));
  return {
    ticket: ev.ganhos ? ev.mrrGanho / ev.ganhos : null, setup: ev.ganhos ? ev.setupGanho / ev.ganhos : null,
    rLeadMeet: ev.leads ? ev.agendada / ev.leads * 100 : null, rShow: ev.agendada ? ev.realizada / ev.agendada * 100 : null,
    rClose: ev.realizada ? ev.ganhos / ev.realizada * 100 : null, cpl: ev.leads && spend ? spend / ev.leads : null, ev
  };
}

/* --------- calculadora de prospecção por canal --------- */
function realRates(db, chId, days = 90) {
  const b = today(), a = addDays(b, -days);
  const pr = prospectTotals(db, a, b, chId);
  const ev = funnelEvents(db, a, b, d => d.channelId === chId);
  const r = (x, y) => (y > 0 ? Math.round(x / y * 1000) / 10 : null);
  return { rResp: r(pr.resp, pr.abord), rConv: r(pr.conv, pr.resp), rMeet: r(ev.agendada, pr.conv), rShow: r(ev.realizada, ev.agendada), rClose: r(ev.ganhos, ev.realizada), pr, ev };
}

/* ============================================================
   PAINEL SEMANAL DE CLIENTES — por campanha
   Tráfego, aquisição e metas por cliente, com dois modelos de funil:
   - agendamento: leads → agendamentos × ticket (clínicas, serviços, varejo)

   ============================================================ */
const PERF_MODELS = {
  agendamento: { l: 'Leads → agendamento', step: 'Agendamentos', stepS: 'agendamento', cac: 'CAC (por agendamento)' },
  venda: { l: 'Leads → reunião → venda fechada', step: 'Reuniões', stepS: 'reunião', cac: 'CAC (por venda fechada)' }
};
const PLATFORMS = ['Meta Ads', 'Google Ads', 'TikTok Ads', 'LinkedIn Ads', 'YouTube', 'Outra'];
const OUTROS = '__outros';
const perfModel = cl => (cl && cl.perfModel === 'venda' ? 'venda' : 'agendamento');
const campaignsOf = cl => (cl && Array.isArray(cl.campaigns) && cl.campaigns.length ? cl.campaigns : [{ id: 'geral', name: 'Geral', platform: 'Meta Ads', active: true }]);
function perfRow(r, model) {
  const spend = n0(r.spend), leads = n0(r.leads), appts = n0(r.appts), sales = n0(r.sales), ticket = n0(r.ticket), outros = n0(r.outros);
  const conv = model === 'venda' ? sales : appts;
  return { ...r, spend, leads, appts, sales, ticket, outros, trafego: conv * ticket };
}
function perfAgg(rows, model) {
  const t = { spend: sum(rows, r => r.spend), leads: sum(rows, r => r.leads), appts: sum(rows, r => r.appts), sales: sum(rows, r => r.sales), trafego: sum(rows, r => r.trafego), outros: sum(rows, r => r.outros) };
  const conv = model === 'venda' ? t.sales : t.appts;
  t.total = t.trafego + t.outros;
  t.roas = t.spend ? t.trafego / t.spend : NaN;
  t.cpl = t.leads ? t.spend / t.leads : NaN;
  t.convStep = t.leads ? t.appts / t.leads * 100 : NaN;     // leads → agendamento/reunião
  t.costStep = t.appts ? t.spend / t.appts : NaN;           // custo por agendamento/reunião
  t.close = t.appts ? t.sales / t.appts * 100 : NaN;        // reunião → venda
  t.cac = conv ? t.spend / conv : NaN;
  t.ticket = conv ? t.trafego / conv : NaN;
  return t;
}
const PERF_PERIODS = [{ v: 'all', l: 'Tudo' }, { v: '7', l: 'Últimos 7 dias' }, { v: '30', l: 'Últimos 30 dias' }, { v: 'mes', l: 'Este mês' }, { v: 'custom', l: 'Período' }];
const perfRecsOf = (db, clId) => vals(db.perf).filter(r => r.clientId === clId);
const monthsSpanned = (a, b) => { let n = 0, m = ymOf(a); while (m <= ymOf(b) && n < 240) { n++; m = addMonths(m, 1); } return Math.max(1, n); };

/* ---------- registrar / editar semana (uma linha por campanha) ---------- */
function PerfWeekForm({ cl, date, onClose }) {
  const db = useDB(); const model = perfModel(cl); const M = PERF_MODELS[model];
  const camps = campaignsOf(cl);
  const existing = date ? perfRecsOf(db, cl.id).filter(r => r.date === date) : [];
  const lastTicket = id => { const r = perfRecsOf(db, cl.id).filter(x => x.campaignId === id && n0(x.ticket) > 0).sort((a, b) => b.date.localeCompare(a.date))[0]; return r ? r.ticket : ''; };
  const [d, setD] = useState(date || today());
  const [rows, setRows] = useState(() => {
    const m = {};
    camps.filter(c => c.active !== false || existing.some(r => r.campaignId === c.id)).forEach(c => {
      const ex = existing.find(r => (r.campaignId || 'geral') === c.id);
      m[c.id] = ex ? { spend: ex.spend, leads: ex.leads, appts: ex.appts, sales: ex.sales, ticket: ex.ticket } : { spend: '', leads: '', appts: '', sales: '', ticket: lastTicket(c.id) };
    });
    return m;
  });
  const exOut = existing.find(r => r.campaignId === OUTROS);
  const [outros, setOutros] = useState(exOut ? exOut.outros : '');
  const setR = (id, k, v) => setRows(p => ({ ...p, [id]: { ...p[id], [k]: v } }));
  const calc = Object.entries(rows).map(([id, r]) => perfRow(r, model));
  const tot = perfAgg(calc, model);
  const save = () => {
    if (!d) return toast('Informe a data.');
    // remove os registros antigos desta data (edição) e grava os novos
    existing.forEach(r => store.del('perf', r.id));
    if (date && date !== d) perfRecsOf(store.data, cl.id).filter(r => r.date === d).forEach(r => store.del('perf', r.id));
    Object.entries(rows).forEach(([cid, r]) => {
      if (![r.spend, r.leads, r.appts, r.sales].some(v => n0(v))) return;
      store.put('perf', { id: cleanKey(cl.id + '_' + d + '_' + cid), clientId: cl.id, campaignId: cid, date: d, spend: n0(r.spend), leads: n0(r.leads), appts: n0(r.appts), sales: n0(r.sales), ticket: n0(r.ticket), by: CURRENT_USER.id });
    });
    if (n0(outros)) store.put('perf', { id: cleanKey(cl.id + '_' + d + '_' + OUTROS), clientId: cl.id, campaignId: OUTROS, date: d, outros: n0(outros), by: CURRENT_USER.id });
    toast('Semana salva.'); onClose();
  };
  const cols = model === 'venda'
    ? [['spend', 'Gasto (R$)'], ['leads', 'Leads'], ['appts', 'Reuniões'], ['sales', 'Vendas fechadas'], ['ticket', 'Ticket médio (R$)']]
    : [['spend', 'Gasto (R$)'], ['leads', 'Leads / conversas'], ['appts', 'Agendamentos'], ['ticket', 'Ticket médio (R$)']];
  return html`<${Modal} title=${(date ? 'Editar semana · ' : 'Registrar semana · ') + cl.name} size="lg" onClose=${onClose} footer=${html`<${Btn} on=${onClose}>Cancelar</${Btn}><${Btn} v="pri" on=${save}>Salvar semana</${Btn}>`}>
    <div class="row wrap mb12"><div style=${{ width: 180 }}><${Input} label="Data" type="date" v=${d} on=${setD}/></div><div class="xs faint" style=${{ flex: 1 }}>Uma linha por campanha. Deixe em branco as campanhas que não rodaram nesta semana.</div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Campanha</th>${cols.map(c => html`<th key=${c[0]} class="r">${c[1]}</th>`)}<th class="r">Faturamento</th></tr></thead><tbody>
      ${Object.keys(rows).map(id => { const c = camps.find(x => x.id === id) || { name: id }; const pr = perfRow(rows[id], model);
    return html`<tr key=${id}><td><b class="small">${c.name}</b><div class="xs faint">${c.platform || ''}</div></td>
          ${cols.map(([k]) => html`<td key=${k}><input class="inp sm num" style=${{ width: k === 'spend' || k === 'ticket' ? 104 : 74, textAlign: 'right' }} inputMode="decimal" value=${rows[id][k] ?? ''} onChange=${e => setR(id, k, e.target.value)}/></td>`)}
          <td class="r num small">${money2(pr.trafego)}</td></tr>`; })}
    </tbody><tfoot><tr><td>Total</td>${cols.map(([k]) => html`<td key=${k} class="r">${k === 'ticket' ? (Number.isFinite(tot.ticket) ? money2(tot.ticket) : '—') : k === 'spend' ? money2(tot.spend) : num(tot[k])}</td>`)}<td class="r">${money2(tot.trafego)}</td></tr></tfoot></table></div>
    <div class="form c2 mt16"><${Money} label="Faturamento via outros canais (orgânico, indicação, loja…)" v=${outros} on=${setOutros} hint="Do cliente na semana, sem ligação com campanha"/>
      <div class="callout info"><b class="t">Faturamento total da semana: ${money2(tot.trafego + n0(outros))}</b>CPL = gasto ÷ leads · ${M.cac} = gasto ÷ ${model === 'venda' ? 'vendas fechadas' : 'agendamentos'} · Faturamento via tráfego = ${model === 'venda' ? 'vendas fechadas' : 'agendamentos'} × ticket médio.</div></div>
  </${Modal}>`;
}

/* ---------- componentes visuais ---------- */
function Gauge({ pct: p }) {
  const v = Number.isFinite(p) ? p : 0; const a = clamp(v, 0, 100) / 100;
  const color = v >= 100 ? 'var(--good)' : v >= 70 ? 'var(--gold)' : 'var(--bad)';
  const R = 70, cx = 90, cy = 86; const ang = Math.PI * (1 - a);
  const ex = cx + R * Math.cos(ang), ey = cy - R * Math.sin(ang);
  return html`<svg viewBox="0 0 180 100" style=${{ width: 190, display: 'block', margin: '0 auto' }} aria-label=${'Meta ' + num(v) + '%'}>
    <path d=${`M${cx - R},${cy} A${R},${R} 0 0 1 ${cx + R},${cy}`} fill="none" stroke="var(--surface-3)" stroke-width="12" stroke-linecap="round"/>
    ${a > 0 && html`<path d=${`M${cx - R},${cy} A${R},${R} 0 0 1 ${ex},${ey}`} fill="none" stroke=${color} stroke-width="12" stroke-linecap="round"/>`}
  </svg>`;
}
function Bench({ l, cur, exp, fmt, lowerBetter, note }) {
  const ok = Number.isFinite(cur) && Number.isFinite(exp) && (lowerBetter ? cur <= exp : cur >= exp);
  const max = Math.max(cur || 0, exp || 0) * 1.15 || 1;
  return html`<div class="card">
    <div class="row between mb8"><b>${l}</b>${Number.isFinite(cur) && Number.isFinite(exp) && html`<${Tag} t=${ok ? 'good' : 'bad'}>${ok ? 'Dentro do esperado' : lowerBetter ? 'Acima do esperado' : 'Abaixo do esperado'}</${Tag}>`}</div>
    <div class="row between small mb8"><span class="muted">Atual</span><b class="num">${Number.isFinite(cur) ? fmt(cur) : '—'}</b></div>
    <div class=${'bar ' + (ok ? 'good' : 'bad')} style=${{ height: 10 }}><i style=${{ width: clamp((cur || 0) / max * 100, 0, 100) + '%' }}/>${Number.isFinite(exp) && html`<span class="pace" style=${{ left: clamp(exp / max * 100, 0, 100) + '%' }} title="Esperado"/>`}</div>
    <div class="row between small mt8"><span class="muted">Esperado</span><b class="num">${Number.isFinite(exp) ? fmt(exp) : '—'}</b></div>
    <div class="xs faint mt8">${note}</div></div>`;
}

  ['appts', /(agend|reuni|meeting|appoint|^conversoes$|^conversions?$)/],
  ['ticket', /ticket/],

  const w = {}; let hits = 0;
  Object.entries(o).forEach(([k, v]) => {
    const nk = normK(k);
    for (const [f, rx] of FIELD_RX) { if (rx.test(nk) && w[f] === undefined) { w[f] = f === 'date' ? toISO(v) : brNum(v); hits++; if (/reuni|meeting/.test(nk)) w._meet = true; break; } }

}
